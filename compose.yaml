name: oceanai

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: oceanai
      POSTGRES_USER: oceanai
      POSTGRES_PASSWORD: oceanai_local_demo
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanai -d oceanai"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://oceanai:oceanai_local_demo@db:5432/oceanai?sslmode=disable
      PORT: "8080"
      GIN_MODE: release
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  verify:
    image: node:24-alpine
    profiles: ["tools"]
    working_dir: /checks
    volumes:
      - ./scripts:/checks:ro
    environment:
      BASE_URL: http://frontend:8080
    command: ["node", "smoke.mjs"]
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
